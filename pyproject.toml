[project]
name = "spectralcrop"
version = "1.0.0"
description = "Non-invasive diagnosis of phosphorus deficiency stress in common beans using hyperspectral imagery and ML/DL"
authors = [
    {name = "John Mario Montoya Zapata", email = "jmmontoyaz@unal.edu.co"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Core numeric / data ---
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scipy==1.16.2",
    # --- Hyperspectral / geospatial ---
    "rasterio==1.4.3",
    "rioxarray==0.20.0",
    "geopandas==1.1.1",
    "affine==2.4.0",
    "spectral==0.24",
    "opencv-python==4.11.0.86",
    # --- Multi-dimensional arrays / storage ---
    "xarray==2025.12.0",
    "dask==2025.10.0",
    "zarr==3.1.5",
    "numcodecs==0.16.5",
    # --- ML ---
    "scikit-learn==1.7.2",
    "imbalanced-learn==0.14.0",
    "xgboost==3.1.2",
    "lightgbm==4.6.0",
    "optuna==4.6.0",
    "joblib==1.5.3",
    # --- Experiment tracking / data versioning ---
    "mlflow==3.8.1",
    "dagshub==0.6.4",
    "dvc[s3]==3.63.0",
    # --- Visualization ---
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    # --- Utilities ---
    "tqdm==4.67.1",
    "python-dotenv==1.1.0",
    "pyprojroot==0.3.0",
    "psutil==7.1.3",
    "pyyaml>=6.0",
    # --- CLI ---
    "typer>=0.12",
    # pathspec >= 0.12 removed _DIR_MARK which DVC 3.63 still uses internally
    "pathspec>=0.10.3,<0.12",
]

[project.optional-dependencies]
# PyTorch CPU-only (for PC A / CI / machines without GPU)
pytorch-cpu = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]
# PyTorch CUDA 12.6 (for PC B — NVIDIA GeForce RTX 3050)
pytorch-cu126 = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]
# Jupyter notebooks (includes exploration-only tools)
notebooks = [
    "jupyter>=1.1",
    "jupyterlab>=4.4",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "nbformat>=5.10",
    "lazypredict==0.2.12",
]
# API serving
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
]
# Development (lint, test, type-checking)
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pre-commit>=3.8",
    "nbformat>=5.10",
]

[project.scripts]
spectralcrop = "spectralcrop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectralcrop"]

# ---------------------------------------------------------------------------
# uv — dependency resolver configuration
# ---------------------------------------------------------------------------
[tool.uv]
# pytorch-cpu and pytorch-cu126 are mutually exclusive.
# Declaring the conflict lets uv resolve each variant independently
# instead of trying to satisfy both simultaneously (which would fail
# because they point to different package indexes).
conflicts = [
    [
        { extra = "pytorch-cpu"   },
        { extra = "pytorch-cu126" },
    ],
]

[tool.uv.sources]
# Route torch/torchvision to the correct index for each exclusive variant
torch = [
    { index = "pytorch-cpu",   extra = "pytorch-cpu"   },
    { index = "pytorch-cu126", extra = "pytorch-cu126" },
]
torchvision = [
    { index = "pytorch-cpu",   extra = "pytorch-cpu"   },
    { index = "pytorch-cu126", extra = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true

# ---------------------------------------------------------------------------
# ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "*.ipynb",
    "archive",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["spectralcrop"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source   = ["spectralcrop"]
branch   = true          # measure branch coverage (not just line coverage)
omit     = [
    "spectralcrop/data/hypercube_processor.py",   # legacy, tested indirectly
    "spectralcrop/visualization/*",
    "spectralcrop/performance/*",
    "spectralcrop/features/generate_features.py",
    "spectralcrop/models/train_model.py",
    "spectralcrop/models/predict_model.py",
]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
skip_empty    = true
precision     = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
exclude                = ["archive/", "docs/", ".venv/"]
