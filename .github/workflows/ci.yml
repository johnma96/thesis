name: CI

on:
  push:
    branches: [main, chore/repo-cleanup-uv]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Smoke tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (CPU + dev)
        run: uv sync --extra pytorch-cpu --extra dev

      - name: Lint — ruff check
        run: uv run ruff check spectralcrop/ tests/ main.py

      - name: Lint — ruff format check
        run: uv run ruff format --check spectralcrop/ tests/ main.py

      - name: Smoke tests
        run: uv run pytest tests/ -v --tb=short

      - name: CLI help smoke test
        run: uv run python main.py --help
