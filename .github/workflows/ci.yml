name: CI

on:
  push:
    branches: [main, chore/repo-cleanup-uv]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Smoke tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (dev only — torch skipped in CI)
        # pytorch-cpu is intentionally excluded: torch-dependent tests use
        # pytest.importorskip("torch") and skip gracefully when not installed.
        # This avoids platform-specific wheel issues and keeps CI fast.
        run: uv sync --extra dev

      - name: Lint — ruff check
        run: uv run ruff check spectralcrop/ tests/ main.py

      - name: Lint — ruff format check
        run: uv run ruff format --check spectralcrop/ tests/ main.py

      - name: Smoke tests
        run: uv run pytest tests/ -v --tb=short

      - name: CLI help smoke test
        run: uv run python main.py --help
